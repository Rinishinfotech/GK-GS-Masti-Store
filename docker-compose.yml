services:
  backend:
    build:
      context: ./backend
    container_name: gkgs-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./storage:/app/storage
    networks:
      - gkgs
      - ct_default

  frontend:
    build:
      context: ./frontend
    container_name: gkgs-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - gkgs

networks:
  gkgs:
    name: gkgs_network

  ct_default:
    external: true
